<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self' about: blob:; img-src data:; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Fit Club · Trainer Portal</title><style>:root{--bg:#101116;--panel:#1c2028;--line:#343a45;--accent:#ff8a38;--muted:#bcc1cd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fa;font:14px/1.5 system-ui,sans-serif}header{background:#17191e;border-bottom:1px solid var(--line);padding:18px max(18px,calc((100vw - 1080px)/2));font-size:21px;font-weight:800}header b{background:var(--accent);color:#171412;border-radius:7px;padding:6px 9px;margin-right:10px}.wrap{max-width:1080px;margin:0 auto;padding:20px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:16px 0}.controls label{display:grid;gap:5px;font-size:12px;color:#d0d5df;font-weight:750}.controls select,input{background:#22252e;color:#fff;border:1px solid #566071;border-radius:9px;padding:11px;min-height:43px;font:inherit}.controls select{min-width:175px}.panel{background:#1b2029;border:1px solid #384150;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:25px;margin:3px 0}.muted{color:var(--muted)}.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{min-width:240px;flex:1}button{border:0;border-radius:9px;padding:11px 16px;min-height:43px;background:var(--accent);color:#201b18;font-weight:800;cursor:pointer}button.secondary{background:#343d4c;color:#fff}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffac74;outline-offset:2px}#status{min-height:23px;color:#ffc39a}iframe{width:100%;min-height:78vh;border:1px solid #3e4653;border-radius:12px;background:#101116}#viewerBox[hidden],#accessPanel[hidden]{display:none}@media(max-width:650px){.wrap{padding:12px}h1{font-size:22px}.controls select{min-width:140px}}</style></head><body><header><b>FC</b> FIT CLUB</header><div class="wrap"><h1>Trainer Workout Library</h1><p class="muted">Detailed coaching prescriptions · trainer access required</p><div class="controls"><label>Branch<select id="branch"><option value="gomtinagar">Gomtinagar</option><option value="mahanagar">Mahanagar</option></select></label><label>Month<select id="month"><option value="2026-11">November 2026</option><option value="2026-12">December 2026</option></select></label></div><div class="panel" id="accessPanel"><strong>Unlock detailed workouts</strong><p class="muted">Enter your assigned Master, Yoga, Burn/Boxing, or Strength/Recovery access key. Select the branch and month first.</p><form id="unlockForm" class="inline"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Trainer access key" required><button type="submit">Unlock</button></form><p id="status" role="status" aria-live="polite"></p></div><div id="viewerBox" hidden><div class="inline" style="justify-content:space-between;margin:10px 0"><strong id="viewLabel"></strong><button class="secondary" id="lock" type="button">Lock / Change key</button></div><iframe id="viewer" title="Fit Club trainer detailed schedule" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer"></iframe></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);const b=$('branch'),m=$('month'),key=$('key'),status=$('status'),frame=$('viewer'),form=$('unlockForm');let loaded=null,serial=0;const roles=['master','yoga','burn_boxing','strength_recovery'];function bytes(s){const raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}function lock(){serial++;frame.removeAttribute('srcdoc');$('viewerBox').hidden=true;$('accessPanel').hidden=false;key.value='';status.textContent=''}function navigate(){const p=new URLSearchParams();if(b.value!=='gomtinagar')p.set('branch',b.value);if(m.value!=='2026-11')p.set('month',m.value);history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));lock()}const p=new URLSearchParams(location.search);if(p.get('branch')==='mahanagar')b.value='mahanagar';if(p.get('month')==='2026-12')m.value='2026-12';b.addEventListener('change',navigate);m.addEventListener('change',navigate);$('lock').addEventListener('click',()=>{lock();key.focus()});async function decrypt(item,password){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(item.salt),iterations:item.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(item.iv),additionalData:new TextEncoder().encode(item.aad),tagLength:128},k,bytes(item.data));return await new Response(new Blob([dec]).stream().pipeThrough(new DecompressionStream('deflate'))).text()}form.addEventListener('submit',async e=>{e.preventDefault();const v=++serial;status.textContent='Checking key…';const branch=b.value,month=m.value;try{if(!crypto?.subtle||typeof DecompressionStream==='undefined')throw Error('Use an updated HTTPS browser.');const resp=await fetch('./trainer-data/'+branch+'-'+month+'.json',{cache:'no-store'});if(!resp.ok)throw Error(resp.status===404?'Trainer schedule is not published for this selection.':'Unable to load encrypted schedule.');const data=await resp.json();if(data.branch!==branch||data.month!==month)throw Error('Schedule identity mismatch.');let unlocked=null,role='';for(const type of roles){try{const result=await decrypt(data.payloads[type],key.value);if(!result.includes('Fit Club · Trainer · '+(branch==='gomtinagar'?'Gomtinagar':'Mahanagar'))||!result.includes('data-date'))throw Error('Integrity check failed');unlocked=result;role=type;break}catch(err){if(err?.name==='NotSupportedError')throw err;}}if(v!==serial)return;if(!unlocked)throw Error('Access key not recognised.');frame.srcdoc=unlocked;$('viewLabel').textContent=(branch==='gomtinagar'?'Gomtinagar':'Mahanagar')+' · '+(month==='2026-11'?'November':'December')+' 2026 · '+role.replaceAll('_',' / ');$('viewerBox').hidden=false;$('accessPanel').hidden=true;key.value='';status.textContent='';}catch(err){if(v===serial){status.textContent=err.message||'Unable to unlock';key.value='';key.focus()}}});})();</script></body></html>
